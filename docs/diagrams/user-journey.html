<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EverSince Partner Experience · User Journey Map</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">User Journey · EverSince</p>
    <h1>Partner experience from secret login to memory timeline</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ever-since-journey-title ever-since-journey-desc">
        <title id="ever-since-journey-title">Partner experience from secret login to memory timeline</title>
        <desc id="ever-since-journey-desc">User journey map of the partner across five stages in EverSince, showing actions, touchpoints, UX safeguards, and a sentiment curve that dips at the anniversary date gate cooldown before rising through the timeline and the Valentine Yes/No prompt.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Stage headers (5 columns of 144px, 20px gutters; centers at 180, 344, 508, 672, 836) -->
        <text x="180" y="48" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.18em">STAGE 1</text>
        <text x="180" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Secret Login</text>

        <text x="344" y="48" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.18em">STAGE 2</text>
        <text x="344" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Date Gate</text>

        <text x="508" y="48" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.18em">STAGE 3</text>
        <text x="508" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">First Memory</text>

        <text x="672" y="48" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.18em">STAGE 4</text>
        <text x="672" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Timeline Flow</text>

        <text x="836" y="48" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.18em">STAGE 5</text>
        <text x="836" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Valentine Prompt</text>

        <!-- Sentiment band (160px tall: y=108 HIGH, y=188 NEUTRAL, y=268 LOW) -->
        <line x1="108" y1="108" x2="908" y2="108" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <line x1="108" y1="188" x2="908" y2="188" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <line x1="108" y1="268" x2="908" y2="268" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

        <text x="96" y="112" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.18em">HIGH</text>
        <text x="96" y="192" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.18em">NEUTRAL</text>
        <text x="96" y="272" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.18em">LOW</text>

        <!-- Sentiment curve (data curve — §6 rule 1 exempt per type-journey.md) -->
        <polyline points="180,188 344,268" fill="none" stroke="#bf4520" stroke-width="1.5" stroke-linejoin="round"/>
        <polyline points="344,268 508,148 672,108 836,108" fill="none" stroke="#4f5d75" stroke-width="1.5" stroke-linejoin="round"/>

        <circle cx="180" cy="188" r="5" fill="#4f5d75"/>
        <circle cx="344" cy="268" r="5" fill="#bf4520"/>
        <circle cx="508" cy="148" r="5" fill="#4f5d75"/>
        <circle cx="672" cy="108" r="5" fill="#4f5d75"/>
        <circle cx="836" cy="108" r="5" fill="#4f5d75"/>

        <!-- Content row separators -->
        <line x1="108" y1="296" x2="908" y2="296" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <line x1="108" y1="388" x2="908" y2="388" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <line x1="108" y1="444" x2="908" y2="444" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

        <!-- Row labels -->
        <text x="96" y="324" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.18em">ACTIONS</text>
        <text x="96" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.18em">TOUCHPOINTS</text>
        <text x="96" y="476" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.18em">UX GUARDS</text>

        <!-- Row 1: Actions -->
        <text x="180" y="324" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Enter 20-char secret</text>
        <text x="344" y="324" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Guess anniversary date</text>
        <text x="508" y="324" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Tap first-card Like</text>
        <text x="672" y="324" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Swipe &amp; play videos</text>
        <text x="836" y="324" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Say Yes to Valentine</text>

        <!-- Pain markers (Stage 2 trough only, max 2) -->
        <rect x="264" y="336" width="160" height="16" rx="2" fill="rgba(191,69,32,0.08)" stroke="rgba(191,69,32,0.50)" stroke-width="0.8" stroke-dasharray="3,3"/>
        <text x="344" y="347" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">MISSES 1–3: SHAKE + TEASE</text>

        <rect x="264" y="356" width="160" height="16" rx="2" fill="rgba(191,69,32,0.08)" stroke="rgba(191,69,32,0.50)" stroke-width="0.8" stroke-dasharray="3,3"/>
        <text x="344" y="367" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">4TH MISS: 30S COOLDOWN</text>

        <!-- Row 2: Touchpoints -->
        <text x="180" y="420" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">/login · iron-session</text>
        <text x="344" y="420" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">DD/MM/YYYY · seal card</text>
        <text x="508" y="420" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">/ · 4:5 card · heart SVG</text>
        <text x="672" y="420" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">photo pile · &lt; / &gt; bar</text>
        <text x="836" y="420" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">valentine card · Yes/No</text>

        <!-- Row 3: UX Guards & Fallbacks -->
        <text x="180" y="476" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">72h cookie · 5-fail IP ban</text>
        <text x="344" y="476" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">numeric pad · auto-tab</text>
        <text x="508" y="476" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">4s mobile swipe hint</text>
        <text x="672" y="476" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">image preload · 1.5s hold</text>
        <text x="836" y="476" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">touch shrink · Tab/Enter</text>

        <!-- Legend strip (bottom 60px) -->
        <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <text x="40" y="552" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

        <line x1="40" y1="568" x2="56" y2="568" stroke="#4f5d75" stroke-width="1.5"/>
        <circle cx="48" cy="568" r="3" fill="#4f5d75"/>
        <text x="64" y="572" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Sentiment curve</text>

        <line x1="216" y1="568" x2="232" y2="568" stroke="#bf4520" stroke-width="1.5"/>
        <circle cx="224" cy="568" r="3" fill="#bf4520"/>
        <text x="240" y="572" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Trough stage (date lockout)</text>

        <rect x="424" y="564" width="16" height="8" rx="2" fill="rgba(191,69,32,0.08)" stroke="rgba(191,69,32,0.50)" stroke-width="0.8" stroke-dasharray="3,3"/>
        <text x="448" y="572" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Pain marker (escalating feedback &amp; cooldown)</text>
      </svg>
    </div>
  </div>
</body>
</html>
